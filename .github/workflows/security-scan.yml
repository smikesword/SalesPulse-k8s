name: security scan with kubescape
on: [push, workflow_dispatch]

jobs:
    security-scan:
    
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: kubescape security scan
          uses: kubescape/github-action@v3.0.21
          continue-on-error: true # for dev don't fail build on security errors
          with:
            format: sarif
            outputFile: results

        - name: Upload Kubescabe scan results to Github Code Scanning
          uses: github/codeql-action/upload-sarif@v2
          with:
            sarif_file: results.sarif